services:
  postgres:
    image: postgres:16-alpine
    container_name: rosetta_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      # Maps local SQL file to the container's initialization directory
      - ./init-database.sql:/docker-entrypoint-initdb.d/init-database.sql
      # Persist data even if container is destroyed
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
  
  frontend:
    build: ./frontend-react
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5001}
      USE_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend-react:/app
      - /app/node_modules
    restart: unless-stopped

  backend-net:
    build: ./backend-net
    container_name: rosetta_net
    profiles: ["net"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=auth_net
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_KEY: ${JWT_KEY}
    ports:
      - "5001:8080"  

volumes:
  postgres_data:
  